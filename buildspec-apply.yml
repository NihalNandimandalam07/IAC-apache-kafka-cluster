version: 0.2

phases:
  install:
    commands:
      - echo "Installing Terraform"
      - curl -fsSLo terraform.zip https://releases.hashicorp.com/terraform/1.13.5/terraform_1.13.5_linux_amd64.zip
      - unzip -o terraform.zip
      - install terraform /usr/local/bin/terraform
      - terraform --version
    
  pre_build:
    commands:
      - echo "Initializing Terraform"
      - terraform init -input=false -lockfile=readonly
  
  build:
    commands:
      - echo "Applying Terraform configuration"
      - test -f tfplan
      - terraform apply -input=false tfplan
  
  post_build:
    commands:
      - echo "Terraform apply completed successfully"S